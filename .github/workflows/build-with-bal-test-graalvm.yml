name: GraalVM Check

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled]

concurrency:
  group: graalvm-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'Skip GraalVM Check')

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v3

      - name: Resolve Java version
        id: resolve-java
        uses: ballerina-platform/ballerina-library/.github/actions/resolve-java-version@main

      - name: Resolve Ballerina version
        run: |
          BAL_VERSION="nightly"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            EXTRACTED="$(grep -E '^\s*ballerinaLangVersion\s*=' gradle.properties | head -n 1 | cut -d= -f2- | xargs || true)"
            if [[ -n "${EXTRACTED}" && "${EXTRACTED}" != *-* ]]; then
              BAL_VERSION="${EXTRACTED}"
            fi
          fi
          echo "BAL_VERSION=${BAL_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved BAL_VERSION: ${BAL_VERSION}"

      - name: Set Up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.5
        with:
          version: ${{ env.BAL_VERSION }}

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ steps.resolve-java.outputs.java-version }}
          distribution: "graalvm-community"
          set-java-home: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check GraalVM installation
        run: |
          echo "GRAALVM_HOME: ${{ env.GRAALVM_HOME }}"
          echo "JAVA_HOME: ${{ env.JAVA_HOME }}"
          native-image --version

      - name: Set ENV Variables
        run: |
          echo -e '${{ toJson(secrets) }}' | jq -r 'to_entries[] | .key + "=" + .value' >> $GITHUB_ENV

      - name: Build Package
        run: ./gradlew build -x test
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Target Directory
        run: sudo rm -rf ballerina/target

      - name: Start Redis Server
        run: |
          cd ballerina/tests/resources/docker
          docker compose -f compose-standalone.yml up -d 

      - name: Test with GraalVM
        run: |
          cd ballerina
          bal test --graalvm

      - name: Stop Redis Server
        run: |
          cd ballerina/tests/resources/docker
          docker compose -f compose-standalone.yml down
